# ==========================================================================
#  Korean Beauty — nginx перед приложением
#
#  Принимает запросы из интернета и передаёт магазину на 127.0.0.1:3000.
#
#  Файл намеренно только для http (порт 80). HTTPS добавит certbot:
#  он сам впишет сертификат, порт 443 и перенаправление с http на https,
#  а потом будет продлевать сертификат автоматически.
#  Если вписать 443 заранее, `nginx -t` упадёт — сертификата ещё нет.
#
#  Установка (Ubuntu), замените koreanbeauty.uz на свой домен:
#
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/korean-beauty
#    sudo sed -i 's/koreanbeauty\.uz/ВАШ-ДОМЕН/g' /etc/nginx/sites-available/korean-beauty
#    sudo ln -s /etc/nginx/sites-available/korean-beauty /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx --redirect -d koreanbeauty.uz -d www.koreanbeauty.uz
# ==========================================================================

# Ограничение частоты входа в админку — второй рубеж защиты
# поверх встроенного в приложение (5 неудачных попыток, затем пауза)
limit_req_zone $binary_remote_addr zone=kb_login:10m rate=10r/m;

upstream korean_beauty {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name koreanbeauty.uz www.koreanbeauty.uz;

    server_tokens off;

    # Фото товаров: до 8 МБ каждое и до 8 штук за раз
    client_max_body_size 70m;

    # Сжатие делает само приложение — не дублируем
    gzip off;

    # По этим заголовкам приложение узнаёт настоящий IP покупателя
    # и то, что соединение защищено. Без них не работают защита от подбора
    # пароля и флаг Secure у cookie.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # Вход в админку — с дополнительным ограничением частоты
    location = /api/admin/login {
        limit_req zone=kb_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://korean_beauty;
    }

    # Загруженные фото: имена уникальны и не меняются — кэш на год
    location /uploads/ {
        proxy_pass http://korean_beauty;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://korean_beauty;
    }
}
